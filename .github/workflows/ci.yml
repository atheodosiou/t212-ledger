# Checks on every push and pull request: typecheck, lint, unit and integration tests, builds, audit, the
# deployment scripts and the Docker images. Needs no secrets.
#
# Deployment is manual: Actions → "CI and deployment" → Run workflow → main. The checks run again, then the
# deploy job asks the VPS, over SSH with a key that may only run `deploy <sha>`, to deploy that commit
# (deploy/t212-deploy.sh; README, "Production"). A push never deploys.
name: CI and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # For the integration tests; they create and drop their own database in it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: t212
          POSTGRES_PASSWORD: t212
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t212"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check deployment branch
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != refs/heads/main ]]; then
            echo '::error::Select main in the Run workflow branch menu.'
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (API)
        run: npm run test -w api

      - name: Unit tests (web)
        run: npm run test -w web -- --watch=false

      - name: Integration tests (API + Postgres)
        run: npm run test:e2e -w api
        env:
          TEST_DATABASE_ADMIN_URL: postgres://t212:t212@localhost:5432/postgres

      - name: Build API
        run: npm run build -w api

      - name: Build web
        run: npm run build -w web

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # What the server builds, built but not pushed anywhere.
      - run: docker build --target api -t t212-api:ci .
      - run: docker build --target web -t t212-web:ci .

  deploy:
    name: Deploy to Contabo
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: https://ledger.theodosiou.me
    concurrency:
      group: t212-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - name: Configure restricted SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/deploy-ssh/key" > /dev/null
          lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/deploy-ssh/known_hosts" > /dev/null

      - name: Build, back up, migrate, switch API and web, verify
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -T -p "$DEPLOY_PORT" \
            -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "root@$DEPLOY_HOST" "deploy $RELEASE_SHA"

      - name: Deployment summary
        if: success()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '### Deployed\n\nCommit: %s\n\n[Site](https://ledger.theodosiou.me) · [Health](https://ledger.theodosiou.me/api/health)\n' \
            "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner SSH files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/deploy-ssh/key" "$RUNNER_TEMP/deploy-ssh/known_hosts"
