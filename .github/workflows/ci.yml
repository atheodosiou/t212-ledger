name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # For the integration tests; they create and drop their own database in it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: t212
          POSTGRES_PASSWORD: t212
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t212"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (API)
        run: npm run test -w api

      - name: Unit tests (web)
        run: npm run test -w web -- --watch=false

      - name: Integration tests (API + Postgres)
        run: npm run test:e2e -w api
        env:
          TEST_DATABASE_ADMIN_URL: postgres://t212:t212@localhost:5432/postgres

      - name: Build API
        run: npm run build -w api

      - name: Build web
        run: npm run build -w web

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
