# /etc/nginx/sites-available/ledger.theodosiou.me (README, "Production"). TLS lines are added by certbot.
#
#   /       → static web app in /var/www/t212-ledger/current (an Angular SPA)
#   /api/   → the API container on 127.0.0.1:3300, path unchanged (the API serves under /api)

server {
    listen 80;
    listen [::]:80;
    server_name ledger.theodosiou.me;

    root /var/www/t212-ledger/current;
    index index.html;

    # Exports (PDF/Excel/JSON) are generated, not uploaded: requests stay small.
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        # The API compares Origin with Host to refuse cross-site writes, and builds nothing from Host.
        proxy_set_header Host $host;
        # Overwrite (never append): the client cannot spoof its address for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # The API sends its own security headers.
    }

    # Hashed bundles never change: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # SPA: every route (/accounts/…, /login, /settings) is index.html.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
