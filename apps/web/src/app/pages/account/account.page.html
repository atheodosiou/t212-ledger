@let acc = state.value();

<div stickyTop class="-mx-4 border-b border-line bg-canvas/95 px-4 backdrop-blur">
  <app-account-header [state]="state" [accountId]="id()" active="overview" />
  @if (collapsed() && portfolioValue() && !state.syncing()) {
    <app-summary-bar class="mt-2" [data]="portfolioValue()!" (expand)="expand()" />
  }
</div>

@if (state.account.error()) {
  <p class="mt-6 rounded-xl border border-loss/30 bg-loss/5 p-4 text-sm text-loss">
    {{ accountError() }}
  </p>
} @else {
  @if (acc && state.syncing()) {
    <app-sync-progress
      class="mt-6 block"
      [account]="acc"
      [now]="state.now()"
      [variant]="firstSync() ? 'full' : 'compact'"
    />
  }

  @if (!state.syncing()) {
    <app-reconciliation-panel class="mt-6" [check]="acc?.reconciliation ?? null" />
    <app-export-check-panel
      class="mt-6"
      [check]="acc?.exportCheck ?? null"
      [state]="acc?.exportState ?? null"
    />
  }

  @if (portfolioError(); as message) {
    <div class="mt-6 rounded-xl border border-loss/30 bg-loss/5 p-4 text-sm text-loss">
      {{ message }}
    </div>
  } @else {
    <div #summary class="mt-6">
      <app-portfolio-summary
        [data]="portfolioValue()"
        [skeleton]="state.syncing()"
        [refreshing]="portfolio.isLoading()"
        (refresh)="portfolio.reload()"
      />
    </div>
    <app-positions-table
      class="mt-3"
      [positions]="portfolioValue()?.positions ?? []"
      [currency]="portfolioValue()?.currency ?? 'EUR'"
      [skeleton]="state.syncing() || !portfolioValue()"
    />
  }
}
